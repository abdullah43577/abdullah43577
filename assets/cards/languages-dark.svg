<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Most used languages">
<title>Most used languages</title>
<style>
  .eyebrow { font: 500 11px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: #7D7B76; }
  .label { font: 500 10.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.3px; fill: #7D7B76; }
  .tick { font: 500 10.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #7D7B76; font-variant-numeric: tabular-nums; }
  .num { font: 500 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #9C9A95; font-variant-numeric: tabular-nums; }
  .name { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #F5F4F2; }
  .value { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; letter-spacing: -0.6px; fill: #F5F4F2; }
  .hero { font: 600 56px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; letter-spacing: -2px; fill: #F5F4F2; }
  .unit { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #9C9A95; }
  .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #9C9A95; }
  .rule { stroke: #30363D; stroke-width: 1; fill: none; }
  .grid { stroke: #21262D; stroke-width: 1; }
</style>
<rect x="0.5" y="0.5" width="399" height="299" rx="12" class="rule"/>

<text x="24" y="34" class="eyebrow">MOST USED LANGUAGES</text><text x="376" y="34" class="eyebrow" text-anchor="end">BY BYTES</text><line x1="24" y1="50" x2="376" y2="50" class="rule"/>
<defs><clipPath id="language-bar"><rect x="24" y="68" width="352" height="12" rx="4"/></clipPath></defs>
<g clip-path="url(#language-bar)"><rect x="24.0" y="68" width="277.9" height="12" fill="#3D85D8"/><rect x="303.9" y="68" width="42.6" height="12" fill="#A08A1E"/><rect x="348.5" y="68" width="10.5" height="12" fill="#9F55D6"/><rect x="361.0" y="68" width="7.8" height="12" fill="#D9582F"/><rect x="370.8" y="68" width="1.7" height="12" fill="#1598A8"/><rect x="374.5" y="68" width="1.5" height="12" fill="#4A4946"/></g>
<rect x="24" y="109" width="10" height="10" rx="2" fill="#3D85D8"/><text x="44" y="118" class="name">TypeScript</text><text x="376" y="118" class="num" text-anchor="end">81.3%</text><rect x="24" y="137" width="10" height="10" rx="2" fill="#A08A1E"/><text x="44" y="146" class="name">JavaScript</text><text x="376" y="146" class="num" text-anchor="end">12.5%</text><rect x="24" y="165" width="10" height="10" rx="2" fill="#9F55D6"/><text x="44" y="174" class="name">CSS</text><text x="376" y="174" class="num" text-anchor="end">3.1%</text><rect x="24" y="193" width="10" height="10" rx="2" fill="#D9582F"/><text x="44" y="202" class="name">HTML</text><text x="376" y="202" class="num" text-anchor="end">2.3%</text><rect x="24" y="221" width="10" height="10" rx="2" fill="#1598A8"/><text x="44" y="230" class="name">Python</text><text x="376" y="230" class="num" text-anchor="end">0.5%</text><rect x="24" y="249" width="10" height="10" rx="2" fill="#4A4946"/><text x="44" y="258" class="name">Other</text><text x="376" y="258" class="num" text-anchor="end">0.4%</text>

</svg>
